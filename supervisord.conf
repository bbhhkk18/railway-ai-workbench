[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log

[program:sshd]
command=/usr/sbin/sshd -D
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:dsh]
command=/usr/bin/dsh web --port 3083 --trusted-host %(ENV_RAILWAY_PUBLIC_DOMAIN)s --trusted-host %(ENV_RAILWAY_PUBLIC_DOMAIN)s:443
environment=NODE_OPTIONS="--max-old-space-size=500",HOME="/root"
priority=30
autorestart=true
startsecs=10
stdout_logfile=/var/log/dsh.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/dsh.err.log
stderr_logfile_maxbytes=10MB

[program:filebrowser]
command=/usr/local/bin/filebrowser -r /root/workspace -a 127.0.0.1 -p 3084 --baseurl /files --noauth
priority=30
autorestart=true
stdout_logfile=/var/log/filebrowser.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/filebrowser.err.log
stderr_logfile_maxbytes=10MB

[program:xray]
command=/usr/local/bin/xray run -c /usr/local/etc/xray/config.json
priority=30
autorestart=true
stdout_logfile=/var/log/xray.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/xray.err.log
stderr_logfile_maxbytes=10MB

[program:cloudflared]
command=/opt/stack/tunnel.sh
priority=40
autorestart=true
startsecs=15
; stdout 走 /dev/stdout 使 [tunnel] 域名出现在 Railway 部署日志, agent 可经 API 读取
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
